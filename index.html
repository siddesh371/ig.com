<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram · login</title>
  <!-- Font Awesome (optional for icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .ig-card {
      background: white;
      border: 1px solid #dbdbdb;
      border-radius: 8px;
      padding: 40px 30px 30px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      text-align: center;
    }
    .ig-logo {
      font-family: 'Billabong', cursive, 'Segoe UI', sans-serif;
      font-size: 2.8rem;
      font-weight: 500;
      letter-spacing: -1px;
      margin-bottom: 28px;
      background: linear-gradient(135deg, #405de6, #5851db, #833ab4, #c13584, #e1306c, #fd1d1d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .ig-card form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .ig-card input {
      padding: 12px 14px;
      background: #fafafa;
      border: 1px solid #dbdbdb;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.15s;
    }
    .ig-card input:focus {
      border-color: #a8a8a8;
      background: white;
    }
    .ig-card .login-btn {
      background: #0095f6;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 6px;
    }
    .ig-card .login-btn:hover {
      background: #1877f2;
    }
    .ig-divider {
      display: flex;
      align-items: center;
      gap: 18px;
      margin: 18px 0 12px;
    }
    .ig-divider hr {
      flex: 1;
      border: none;
      border-top: 1px solid #dbdbdb;
    }
    .ig-divider span {
      color: #8e8e8e;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .ig-card .forgot-link {
      color: #385185;
      font-size: 0.8rem;
      text-decoration: none;
      margin-top: 8px;
    }
    .ig-card .forgot-link:hover {
      text-decoration: underline;
    }
    .ig-card .signup-msg {
      border-top: 1px solid #dbdbdb;
      margin-top: 28px;
      padding-top: 24px;
      font-size: 0.95rem;
      color: #262626;
    }
    .ig-card .signup-msg a {
      color: #0095f6;
      font-weight: 600;
      text-decoration: none;
    }
    .footer-note {
      margin-top: 20px;
      font-size: 0.75rem;
      color: #8e8e8e;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="ig-card">
    <div class="ig-logo">Instagram</div>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Phone number, username, or email" value="demo_user" required />
      <input type="password" id="password" placeholder="Password" value="demo123" required />
      <button type="submit" class="login-btn">Log in</button>
      <div class="ig-divider">
        <hr /><span>OR</span><hr />
      </div>
      <a href="#" class="forgot-link">Forgot password?</a>
      <div class="signup-msg">
        Don't have an account? <a href="#">Sign up</a>
      </div>
    </form>
    <div class="footer-note">
      <i class="fas fa-lock" style="margin-right: 6px;"></i> Your login is recorded
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      const loginForm = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');

      // ----- load existing records from localStorage -----
      function getRecords() {
        const stored = localStorage.getItem('ig_login_records');
        if (stored) {
          try {
            const parsed = JSON.parse(stored);
            return Array.isArray(parsed) ? parsed : [];
          } catch (e) {
            return [];
          }
        }
        return [];
      }

      // ----- save records -----
      function saveRecords(records) {
        localStorage.setItem('ig_login_records', JSON.stringify(records));
      }

      // ----- add new login record -----
      function addRecord(username, password) {
        const records = getRecords();
        const newEntry = {
          id: Date.now(),
          username: username.trim() || '(empty)',
          password: password.trim() || '(empty)',
          timestamp: new Date().toLocaleString()
        };
        records.push(newEntry);
        saveRecords(records);
      }

      // ----- handle form submit -----
      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const username = usernameInput.value;
        const password = passwordInput.value;

        // save to localStorage
        addRecord(username, password);

        // visual feedback
        const btn = loginForm.querySelector('.login-btn');
        const originalText = btn.textContent;
        btn.textContent = '✓ Saved';
        btn.style.background = '#34a853';
        setTimeout(() => {
          btn.textContent = originalText;
          btn.style.background = '#0095f6';
        }, 1200);

        // (optional) clear fields? we keep them for demo
      });

      // if there are no records, seed with a demo entry so admin sees something
      // (this ensures the admin panel isn't empty on first visit)
      (function seedIfEmpty() {
        const records = getRecords();
        if (records.length === 0) {
          const demo = {
            id: 1,
            username: 'demo_ig',
            password: 'password123',
            timestamp: new Date().toLocaleString()
          };
          records.push(demo);
          saveRecords(records);
        }
      })();

    })();
  </script>
</body>
</html>
